rules:
  - id: resibo-no-eval
    languages: [typescript, javascript]
    severity: ERROR
    message: Do not use eval or new Function; parse structured data instead.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: resibo-no-sql-string-building
    languages: [typescript, javascript]
    severity: ERROR
    message: Build SQL with bound parameters ($1, $2), not template strings or concatenation.
    pattern-either:
      - pattern: $DB.query(`...${$X}...`)
      - pattern: $DB.query("..." + $X)

  - id: resibo-no-hardcoded-api-key
    languages: [typescript, javascript]
    severity: ERROR
    message: Read keys from config/env, never hard-code them.
    pattern-regex: (api_?key|API_?KEY)\s*[:=]\s*["'][A-Za-z0-9_\-]{16,}["']

  - id: resibo-no-langchain
    languages: [typescript, javascript]
    severity: ERROR
    message: Project rule - no LangChain; call the LLM client directly.
    pattern-regex: (from\s+|require\(\s*)["']@?langchain

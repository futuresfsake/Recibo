rules:
  - id: resibo-no-eval
    languages: [python]
    severity: ERROR
    message: Do not use eval/exec; parse structured data instead.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: resibo-no-sql-string-building
    languages: [python]
    severity: ERROR
    message: Build SQL with bound parameters, not f-strings or concatenation.
    pattern-either:
      - pattern: $CONN.execute(f"...")
      - pattern: $CONN.execute("..." + $X)
      - pattern: $CONN.execute("...".format(...))

  - id: resibo-no-hardcoded-api-key
    languages: [python]
    severity: ERROR
    message: Read keys from settings/env, never hard-code them.
    pattern-regex: (api_key|API_KEY)\s*=\s*["'][A-Za-z0-9_\-]{16,}["']

  - id: resibo-no-langchain
    languages: [python]
    severity: ERROR
    message: Project rule - no LangChain; call the LLM client directly.
    pattern-either:
      - pattern: import langchain
      - pattern: from langchain import ...
      - pattern: from langchain_core import ...

name: ci

on:
  push:
    branches: [main, staging, dev]
  pull_request:

# least privilege: jobs only read the code unless they ask for more below
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run trace
      - run: npm run check:local-data

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@v4
      # local rules only; --error fails the job on any finding; no usage metrics sent
      - run: semgrep scan --config .semgrep.yml --error --metrics=off

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists the commits of a pull request through the API
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

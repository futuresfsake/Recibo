# Dev/eval only. The production path is stateless and has no database.
# Run from the repo root:  docker compose -f infra/docker-compose.yml --env-file .env up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resibo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resibo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-resibo}
    ports:
      - "5432:5432"
    volumes:
      - resibo_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resibo -d resibo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  resibo_pgdata:

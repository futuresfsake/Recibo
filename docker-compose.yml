services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resibo-db
    environment:
      POSTGRES_USER: resibo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: resibo
    ports:
      - "5432:5432"
    volumes:
      - resibo_pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resibo -d resibo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  resibo_pgdata:
